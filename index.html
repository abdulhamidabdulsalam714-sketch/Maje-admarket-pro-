<!-- INDIVIDUAL ADVERTISEMENT PAGE -->

<section id="adPage" class="ad-page">

  <div class="container">

    <button
      type="button"
      class="secondary"
      id="backToAds"
    >
      ← Back to Advertisements
    </button>

    <div
      class="card"
      id="singleAd"
      style="margin-top:20px"
    ></div>

  </div>

</section>

<script>

/* =========================================
   OPEN UNIQUE ADVERTISEMENT
========================================= */

function openAdvertisement(id) {

  const ads = getAds();

  const ad = ads.find(function(item) {
    return item.id === id;
  });

  if (!ad) {
    alert("Advertisement not found.");
    return;
  }

  const page = document.getElementById("adPage");
  const single = document.getElementById("singleAd");

  let imageHTML = "";

  if (ad.image) {
    imageHTML =
      '<img src="' +
      escapeHTML(ad.image) +
      '" ' +
      'alt="Advertisement" ' +
      'style="width:100%;max-height:400px;object-fit:cover;border-radius:10px">';
  }

  single.innerHTML =

    imageHTML +

    '<div style="margin-top:20px">' +

      '<div class="ad-business">' +
        escapeHTML(ad.business) +
      '</div>' +

      '<h2>' +
        escapeHTML(ad.title) +
      '</h2>' +

      '<p>' +
        escapeHTML(ad.description) +
      '</p>' +

      '<p>' +
        '<strong>Contact:</strong> ' +
        escapeHTML(ad.contact) +
      '</p>' +

      '<p>' +
        '<strong>Package:</strong> ' +
        escapeHTML(ad.package) +
      '</p>' +

    '</div>' +

    '<div class="share-box">' +

      '<strong>Share this advertisement</strong>' +

      '<div class="share-buttons">' +

        '<button ' +
          'type="button" ' +
          'id="whatsappShare">' +
          'WhatsApp' +
        '</button>' +

        '<button ' +
          'type="button" ' +
          'id="instagramShare">' +
          'Instagram' +
        '</button>' +

        '<button ' +
          'type="button" ' +
          'id="facebookShare">' +
          'Facebook' +
        '</button>' +

        '<button ' +
          'type="button" ' +
          'id="xShare">' +
          'X / Twitter' +
        '</button>' +

        '<button ' +
          'type="button" ' +
          'class="secondary" ' +
          'id="copyLink">' +
          'Copy Link' +
        '</button>' +

      '</div>' +

    '</div>';


  page.style.display = "block";

  page.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });


  /*
     UNIQUE LINK FOR THIS ADVERTISEMENT
  */

  const shareUrl =
    window.location.href.split("#")[0] +
    "#ad=" +
    encodeURIComponent(ad.id);


  /*
     WHATSAPP
  */

  document
    .getElementById("whatsappShare")
    .onclick = function() {

      const url =
        "https://wa.me/?text=" +
        encodeURIComponent(
          ad.title +
          " - " +
          shareUrl
        );

      window.open(url, "_blank");

    };


  /*
     INSTAGRAM
     
     Instagram does not provide the same
     normal web-share URL as Facebook.
     Use the Android/native share menu.
  */

  document
    .getElementById("instagramShare")
    .onclick = async function() {

      await shareForSocialApp(
        ad,
        shareUrl,
        "Instagram"
      );

    };


  /*
     FACEBOOK
  */

  document
    .getElementById("facebookShare")
    .onclick = function() {

      const url =
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(shareUrl);

      window.open(url, "_blank");

    };


  /*
     X / TWITTER
  */

  document
    .getElementById("xShare")
    .onclick = function() {

      const url =
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(ad.title) +
        "&url=" +
        encodeURIComponent(shareUrl);

      window.open(url, "_blank");

    };


  /*
     COPY LINK
  */

  document
    .getElementById("copyLink")
    .onclick = function() {

      copyToClipboard(shareUrl);

    };

}


/* =========================================
   INSTAGRAM / NATIVE SHARING
========================================= */

async function shareForSocialApp(
  ad,
  url,
  appName
) {

  const shareData = {

    title: ad.title,

    text:
      ad.title +
      "\n\n" +
      ad.description,

    url: url

  };


  /*
     Android browsers normally open the
     native share menu here.

     The user can choose Instagram if
     Instagram is installed and supports
     the shared content.
  */

  if (
    navigator.share
  ) {

    try {

      await navigator.share(
        shareData
      );

      return;

    } catch (error) {

      /*
         User cancelled sharing.
         Do nothing.
      */

      return;

    }

  }


  /*
     Fallback
  */

  copyToClipboard(url);

  alert(
    "Your browser does not support direct sharing. " +
    "The advertisement link has been copied. " +
    "Open " +
    appName +
    " and paste the link."
  );

}


/* =========================================
   COPY LINK
========================================= */

async function copyToClipboard(text) {

  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      "Advertisement link copied!"
    );

  } catch {

    const input =
      document.createElement("input");

    input.value = text;

    document.body.appendChild(input);

    input.select();

    document.execCommand("copy");

    input.remove();

    alert(
      "Advertisement link copied!"
    );

  }

}


/* =========================================
   BACK BUTTON
========================================= */

document
  .getElementById("backToAds")
  .onclick = function() {

    document
      .getElementById("adPage")
      .style.display = "none";

    goTo("advertisements");

  };

</script>
