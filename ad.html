<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Advertisement | Maje AdMarket Pro
</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101111;
  color:#f4f1e9;
}

header{
  background:#191b1b;
  color:#f4f1e9;
  text-align:center;
  padding:22px 15px;
  border-bottom:1px solid #383936;
}

header h1{
  margin:0;
}

header p{
  margin:8px 0 0;
  color:#aaa69c;
}

.container{
  max-width:800px;
  margin:30px auto;
  padding:20px;
}

.advertisement{
  background:#191b1b;
  padding:25px;
  border-radius:14px;
  border:1px solid #383936;
}

.advertisement h2{
  margin-top:0;
  font-size:30px;
  color:#e0c17a;
}

.advertisement img,
.advertisement video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:10px;
  margin:20px 0;
}

.description{
  font-size:17px;
  line-height:1.7;
  color:#f4f1e9;
}

.description p{
  color:#f4f1e9;
}

.contact{
  margin-top:20px;
  padding:15px;
  background:#111313;
  border:1px solid #383936;
  border-radius:8px;
  font-weight:bold;
}

.share{
  margin-top:30px;
}

.share h3{
  margin-bottom:12px;
  color:#e0c17a;
}

.share button{
  border:0;
  padding:12px 17px;
  margin:5px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.whatsapp{
  background:#25D366;
  color:white;
}

.facebook{
  background:#1877F2;
  color:white;
}

.x{
  background:#111827;
  color:white;
}

.copy{
  background:#c9a45c;
  color:#111;
}

.back{
  display:inline-block;
  margin-top:25px;
  padding:12px 18px;
  background:#c9a45c;
  color:#111;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.message{
  background:#191b1b;
  padding:30px;
  border-radius:12px;
  text-align:center;
  border:1px solid #383936;
  color:#aaa69c;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>

<h1>
Maje AdMarket Pro
</h1>

<p>
Advertise. Reach More People. Grow Your Business.
</p>

</header>


<div class="container">

<div
  id="content"
  class="message"
>
Loading advertisement...
</div>

</div>


<script>

"use strict";


/* ======================================
   SUPABASE
====================================== */

const SUPABASE_URL =
  "https://rkobepfufwybyaixzgcu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kZhOi6-GaJzn98OqWehkOA_PDBrPsxX";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ======================================
   HTML ESCAPE
====================================== */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;

}


/* ======================================
   LOAD ADVERTISEMENT
====================================== */

async function loadAdvertisement(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  const content =
    document.getElementById("content");


  if(!id){

    content.innerHTML =
      "<p>Advertisement not found.</p>";

    return;

  }


  const adId =
    Number(id);


  if(!Number.isInteger(adId)){

    content.innerHTML =
      "<p>Invalid advertisement.</p>";

    return;

  }


  try{


    /* ==================================
       LOAD ADVERTISEMENT
    ================================== */

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/advertisements" +
        "?select=*" +
        "&id=eq." +
        encodeURIComponent(adId) +
        "&limit=1",

        {

          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if(!response.ok){

      throw new Error(
        "Could not load advertisement"
      );

    }


    const ads =
      await response.json();


    if(
      !Array.isArray(ads) ||
      ads.length === 0
    ){

      content.innerHTML =
        "<p>Advertisement not found.</p>";

      return;

    }


    const ad =
      ads[0];


    /* =================================
   INCREASE VIEW COUNT
================================== */
console.log("VIEW COUNTER STARTED", ad.id, ad.status);
try {

  const actualAdId = Number(ad.id);

  if (
    ad.status === "approved" &&
    Number.isInteger(actualAdId)
  ) {

    const viewResponse = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/increment_ad_view",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          ad_id: actualAdId
        })
      }
    );

    const viewResult =
      await viewResponse.text();

    console.log(
      "VIEW COUNT:",
      viewResponse.status,
      viewResult
    );

    if (!viewResponse.ok) {

      console.error(
        "VIEW COUNT FAILED:",
        viewResult
      );

    }

  }

} catch (viewError) {

  console.error(
    "VIEW COUNT REQUEST FAILED:",
    viewError
  );

}
    /* ==================================
       MEDIA
    ================================== */

    let mediaHTML = "";


    if(
      ad.media_type === "video" &&
      ad.media_url
    ){

      mediaHTML =
        '<video src="' +
        escapeHTML(ad.media_url) +
        '" controls playsinline></video>';

    }else if(ad.media_url){

      mediaHTML =
        '<img src="' +
        escapeHTML(ad.media_url) +
        '" alt="Advertisement image">';

    }


    /* ==================================
       EXTENDED DESCRIPTION
    ================================== */

    let extendedHTML = "";


    if(ad.extended_description){

      extendedHTML =
        "<p>" +
        escapeHTML(
          ad.extended_description
        ) +
        "</p>";

    }


    /* ==================================
       DISPLAY ADVERTISEMENT
    ================================== */

    content.className =
      "advertisement";


    content.innerHTML =

      "<h2>" +

      escapeHTML(
        ad.advert_title ||
        "Advertisement"
      ) +

      "</h2>" +

      "<p><strong>" +

      escapeHTML(
        ad.advertiser_name ||
        ""
      ) +

      "</strong></p>" +

      mediaHTML +

      '<div class="description">' +

      "<p>" +

      escapeHTML(
        ad.description ||
        ""
      ) +

      "</p>" +

      extendedHTML +

      "</div>" +

      '<div class="contact">' +

      "<strong>Contact:</strong><br>" +

      escapeHTML(
        ad.contact ||
        ""
      ) +

      "</div>" +

      '<div class="share">' +

      "<h3>Share this advertisement</h3>" +

      '<button class="whatsapp" onclick="shareWhatsApp()">WhatsApp</button>' +

      '<button class="facebook" onclick="shareFacebook()">Facebook</button>' +

      '<button class="x" onclick="shareX()">X</button>' +

      '<button class="copy" onclick="copyLink()">Copy Link</button>' +

      "</div>" +

      '<a class="back" href="index.html">' +

      "Back to Maje AdMarket Pro" +

      "</a>";


  }catch(error){

    console.error(
      "ADVERTISEMENT ERROR:",
      error
    );

    content.innerHTML =
      "<p>Unable to load advertisement.</p>";

  }

}


/* ======================================
   WHATSAPP
====================================== */

function shareWhatsApp(){

  const text =
    "Check out this advertisement on Maje AdMarket Pro: " +
    window.location.href;

  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(text);

  window.open(
    url,
    "_blank"
  );

}


/* ======================================
   FACEBOOK
====================================== */

function shareFacebook(){

  const url =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(
      window.location.href
    );

  window.open(
    url,
    "_blank"
  );

}


/* ======================================
   X
====================================== */

function shareX(){

  const url =
    "https://twitter.com/intent/tweet?url=" +
    encodeURIComponent(
      window.location.href
    );

  window.open(
    url,
    "_blank"
  );

}


/* ======================================
   COPY LINK
====================================== */

async function copyLink(){

  try{

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "Advertisement link copied!"
    );

  }catch(error){

    alert(
      "Copy the link from the browser address bar."
    );

  }

}


/* ======================================
   START
====================================== */

loadAdvertisement();

</script>

</body>
</html>
