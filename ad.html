</style></head><body><header><h1>
Maje AdMarket Pro
</h1><p>
Advertise. Reach More People. Grow Your Business.
</p></header><div class="container"><div id="content" class="message">Loading advertisement...

</div></div><script>

const SUPABASE_URL =
"https://rkobepfufwybyaixzgcu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kZhOi6-GaJzn98OqWehkOA_PDBrPsxX";


function escapeHTML(value) {

const div =
document.createElement("div");

div.textContent =
value || "";

return div.innerHTML;

}


async function loadAdvertisement() {

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

const content =
document.getElementById("content");


if (!id) {

content.innerHTML =
"<p>Advertisement not found.</p>";

return;

}


try {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/advertisements" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&status=eq.approved" +
"&limit=1",

{

headers: {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

}

);


if (!response.ok) {

throw new Error(
"Could not load advertisement"
);

}


const ads =
await response.json();


if (ads.length === 0) {

content.innerHTML =
"<p>Advertisement not found.</p>";

return;

}


const ad =
ads[0];


const image =
ad.image_url
?

'<img src="' +
escapeHTML(ad.image_url) +
'" alt="Advertisement image">'

:

"";


const extended =
ad.extended_description
?

"<p>" +
escapeHTML(
ad.extended_description
) +
"</p>"

:

"";


content.className =
"advertisement";


content.innerHTML =

"<h2>" +

escapeHTML(
ad.advert_title ||
"Advertisement"
) +

"</h2>" +

"<p><strong>" +

escapeHTML(
ad.advertiser_name ||
""
) +

"</strong></p>" +

image +

'<div class="description">' +

"<p>" +

escapeHTML(
ad.description ||
""
) +

"</p>" +

extended +

"</div>" +

'<div class="contact">' +

"<strong>Contact:</strong><br>" +

escapeHTML(
ad.contact ||
""
) +

"</div>" +

'<div class="share">' +

"<h3>Share this advertisement</h3>" +

'<button class="whatsapp" onclick="shareWhatsApp()">WhatsApp</button>' +

'<button class="facebook" onclick="shareFacebook()">Facebook</button>' +

'<button class="x" onclick="shareX()">X</button>' +

'<button class="copy" onclick="copyLink()">Copy Link</button>' +

"</div>" +

'<a class="back" href="index.html">' +

"Back to Maje AdMarket Pro" +

"</a>";

}


catch (error) {

console.error(error);

content.innerHTML =
"<p>Unable to load advertisement.</p>";

}

}


function shareWhatsApp() {

const text =
"Check out this advertisement on Maje AdMarket Pro: " +
window.location.href;

const url =
"https://wa.me/?text=" +
encodeURIComponent(text);

window.open(
url,
"_blank"
);

}


function shareFacebook() {

const url =
"https://www.facebook.com/sharer/sharer.php?u=" +
encodeURIComponent(
window.location.href
);

window.open(
url,
"_blank"
);

}


function shareX() {

const url =
"https://twitter.com/intent/tweet?url=" +
encodeURIComponent(
window.location.href
);

window.open(
url,
"_blank"
);

}


async function copyLink() {

try {

await navigator.clipboard.writeText(
window.location.href
);

alert(
"Advertisement link copied!"
);

}

catch (error) {

alert(
"Copy the link from the browser address bar."
);

}

}


loadAdvertisement();

</script></body></html>
