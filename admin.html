<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maje AdMarket Pro - Admin</title>  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
    }

    .login-button {
      background: #2563eb;
      color: white;
      width: 100%;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .delete {
      background: #111827;
      color: white;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #6b7280;
      color: white;
    }

    .ad {
      border: 1px solid #e5e7eb;
      padding: 20px;
      margin-top: 15px;
      border-radius: 10px;
    }

    .ad h3 {
      margin-top: 0;
    }

    .ad img {
      max-width: 250px;
      max-height: 250px;
      border-radius: 8px;
      display: block;
      margin-top: 10px;
    }

    .status {
      font-weight: bold;
      padding: 5px 0;
    }

    .pending {
      color: #b45309;
    }

    .approved {
      color: #15803d;
    }

    .rejected {
      color: #dc2626;
    }

    #dashboard {
      display: none;
    }

    #loginMessage,
    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .empty {
      text-align: center;
      padding: 20px;
    }
  </style></head><body><header>
  <h1>Maje AdMarket Pro</h1>
  <p>Administrator Dashboard</p>
</header><div class="container">  <!-- LOGIN -->  <div class="box" id="loginBox"><h2>Admin Login</h2>

<input
  type="email"
  id="email"
  placeholder="Admin email"
  autocomplete="email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button
  class="login-button"
  onclick="login()"
>
  Login
</button>

<div id="loginMessage"></div>

  </div>  <!-- DASHBOARD -->  <div id="dashboard"><div class="box">

  <h2>Advertisement Management</h2>

  <button
    class="refresh"
    onclick="loadAdvertisements()"
  >
    Refresh
  </button>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

  <div id="message"></div>

</div>


<div class="box">

  <h2>Submitted Advertisements</h2>

  <div id="advertisements">
    Loading advertisements...
  </div>

</div>

  </div></div><script>

  const SUPABASE_URL =
    "https://rkobepfufwybyaixzgcu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_kZhOi6-GaJzn98OqWehkOA_PDBrPsxX";


  let accessToken = null;


  // LOGIN

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const loginMessage =
      document.getElementById("loginMessage");

    if (!email || !password) {

      loginMessage.textContent =
        "Please enter your email and password.";

      return;
    }

    loginMessage.textContent =
      "Logging in...";


    try {

      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          "Login failed"
        );

      }


      accessToken =
        data.access_token;


      document.getElementById(
        "loginBox"
      ).style.display = "none";


      document.getElementById(
        "dashboard"
      ).style.display = "block";


      loadAdvertisements();


    } catch (error) {

      console.error(error);

      loginMessage.textContent =
        "Login failed. Check your email and password.";

    }

  }



  // LOAD ADVERTISEMENTS

  async function loadAdvertisements() {

    const container =
      document.getElementById(
        "advertisements"
      );


    container.innerHTML =
      "Loading advertisements...";


    try {

      const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/advertisements?select=*&order=created_at.desc",

        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + accessToken

          }

        }

      );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      const ads =
        await response.json();


      if (ads.length === 0) {

        container.innerHTML =
          '<div class="empty">No advertisements found.</div>';

        return;

      }


      container.innerHTML = "";


      ads.forEach(function(ad) {

        const item =
          document.createElement("div");


        item.className =
          "ad";


        const status =
          ad.status || "pending";


        let statusClass =
          "pending";


        if (status === "approved") {
          statusClass = "approved";
        }

        if (status === "rejected") {
          statusClass = "rejected";
        }


        let imageHTML = "";


        if (ad.image_url) {

          imageHTML = `
            <img
              src="${escapeHTML(ad.image_url)}"
              alt="Advertisement image"
            >
          `;

        }


        item.innerHTML = `

          <h3>
            ${escapeHTML(
              ad.advert_title ||
              "Untitled Advertisement"
            )}
          </h3>


          <p>
            <strong>Advertiser:</strong>
            ${escapeHTML(
              ad.advertiser_name || ""
            )}
          </p>


          <p>
            <strong>Description:</strong><br>
            ${escapeHTML(
              ad.description || ""
            )}
          </p>


          <p>
            <strong>Extended Description:</strong><br>
            ${escapeHTML(
              ad.extended_description ||
              "No extended description provided."
            )}
          </p>


          <p>
            <strong>Contact:</strong>
            ${escapeHTML(
              ad.contact || ""
            )}
          </p>


          <p class="status ${statusClass}">
            <strong>Status:</strong>
            ${escapeHTML(status)}
          </p>


          ${imageHTML}


          <div>

            <button
              class="approve"
              onclick="updateStatus(
                '${escapeJS(ad.id)}',
                'approved'
              )"
            >
              Approve
            </button>


            <button
              class="reject"
              onclick="updateStatus(
                '${escapeJS(ad.id)}',
                'rejected'
              )"
            >
              Reject
            </button>


            <button
              class="delete"
              onclick="deleteAdvertisement(
                '${escapeJS(ad.id)}'
              )"
            >
              Delete
            </button>

          </div>

        `;


        container.appendChild(item);

      });


    } catch (error) {

      console.error(error);

      container.innerHTML =
        "<p>Could not load advertisements.</p>";

    }

  }



  // APPROVE / REJECT

  async function updateStatus(
    id,
    status
  ) {

    try {

      const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/advertisements?id=eq." +
        encodeURIComponent(id),

        {

          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + accessToken,

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            status:
              status

          })

        }

      );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      showMessage(
        "Advertisement updated successfully."
      );


      loadAdvertisements();


    } catch (error) {

      console.error(error);

      showMessage(
        "Could not update the advertisement. Check your Supabase permissions."
      );

    }

  }



  // DELETE

  async function deleteAdvertisement(id) {

    if (
      !confirm(
        "Are you sure you want to delete this advertisement?"
      )
    ) {

      return;

    }


    try {

      const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/advertisements?id=eq." +
        encodeURIComponent(id),

        {

          method: "DELETE",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + accessToken,

            "Prefer":
              "return=minimal"

          }

        }

      );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      showMessage(
        "Advertisement deleted successfully."
      );


      loadAdvertisements();


    } catch (error) {

      console.error(error);

      showMessage(
        "Could not delete the advertisement. Check your Supabase permissions."
      );

    }

  }



  // LOGOUT

  function logout() {

    accessToken = null;


    document.getElementById(
      "dashboard"
    ).style.display = "none";


    document.getElementById(
      "loginBox"
    ).style.display = "block";


    document.getElementById(
      "password"
    ).value = "";


    document.getElementById(
      "advertisements"
    ).innerHTML = "";

  }



  // MESSAGE

  function showMessage(text) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;

  }



  // SECURITY HELPERS

  function escapeHTML(value) {

    const div =
      document.createElement("div");


    div.textContent =
      value || "";


    return div.innerHTML;

  }


  function escapeJS(value) {

    return String(value || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }

</script></body>
</html>
