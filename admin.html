<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maje AdMarket Pro - Admin</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: 30px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0 15px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
}

button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin: 4px;
}

button:hover {
  opacity: 0.88;
}

.login-button {
  background: #2563eb;
  color: white;
  width: 100%;
}

.approve {
  background: #16a34a;
  color: white;
}

.reject {
  background: #dc2626;
  color: white;
}

.delete {
  background: #111827;
  color: white;
}

.refresh {
  background: #2563eb;
  color: white;
}

.logout {
  background: #6b7280;
  color: white;
}

.view-ad {
  background: #7c3aed;
  color: white;
}

.ad {
  border: 1px solid #e5e7eb;
  padding: 20px;
  margin-top: 15px;
  border-radius: 10px;
}

.ad h3 {
  margin-top: 0;
}

.ad img {
  max-width: 250px;
  max-height: 250px;
  border-radius: 8px;
  display: block;
  margin-top: 10px;
}

.status {
  font-weight: bold;
  padding: 5px 0;
}

.pending {
  color: #b45309;
}

.approved {
  color: #15803d;
}

.rejected {
  color: #dc2626;
}

#dashboard {
  display: none;
}

#loginMessage,
#message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
}

.empty {
  text-align: center;
  padding: 20px;
}


/* ================================
   SHARE BUTTONS
================================ */

.share-box {
  margin-top: 18px;
  padding: 16px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
}

.share-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
  color: #374151;
}

.share-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.whatsapp {
  background: #25D366;
  color: white;
}

.instagram {
  background: #C13584;
  color: white;
}

.facebook {
  background: #1877F2;
  color: white;
}

.x-button {
  background: #000;
  color: white;
  border: 1px solid #555;
}

.copy-link {
  background: #475569;
  color: white;
}


/* ================================
   ADVERTISEMENT INFORMATION
================================ */

.ad-id {
  font-size: 11px;
  color: #6b7280;
  word-break: break-all;
}

.action-section {
  margin-top: 15px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

  .container {
    margin: 10px auto;
    padding: 10px;
  }

  .box {
    padding: 18px;
  }

  .share-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .share-buttons button {
    width: 100%;
    margin: 2px;
  }

}

</style>

</head>

<body>


<header>

  <h1>Maje AdMarket Pro</h1>

  <p>Administrator Dashboard</p>

</header>


<div class="container">


<!-- ================================
     LOGIN
================================ -->

<div class="box" id="loginBox">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    class="login-button"
    onclick="login()"
  >
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<!-- ================================
     DASHBOARD
================================ -->

<div id="dashboard">


  <div class="box">

    <h2>Advertisement Management</h2>

    <button
      class="refresh"
      onclick="loadAdvertisements()"
    >
      Refresh
    </button>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

    <div id="message"></div>

  </div>


  <div class="box">

    <h2>Submitted Advertisements</h2>

    <div id="advertisements">
      Loading advertisements...
    </div>

  </div>


</div>

</div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://rkobepfufwybyaixzgcu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_kZhOi6-GaJzn98OqWehkOA_PDBrPsxX";


let accessToken = null;


/* =========================================
   PUBLIC ADVERTISEMENT PAGE
========================================= */

function getPublicAdvertisementUrl(id) {

  /*
    This assumes your public advertisement
    page is the same website/page using:

    #ad=ADVERTISEMENT_ID
  */

  return (
    window.location.origin +
    window.location.pathname.replace(
      "admin.html",
      "advertisement.html"
    ) +
    "#ad=" +
    encodeURIComponent(id)
  );

}


/* =========================================
   LOGIN
========================================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const loginMessage =
    document.getElementById("loginMessage");


  if (!email || !password) {

    loginMessage.textContent =
      "Please enter your email and password.";

    return;

  }


  loginMessage.textContent =
    "Logging in...";


  try {

    const response = await fetch(

      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",

      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY

        },

        body: JSON.stringify({

          email:
            email,

          password:
            password

        })

      }

    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(

        data.error_description ||
        data.msg ||
        "Login failed"

      );

    }


    accessToken =
      data.access_token;


    document.getElementById(
      "loginBox"
    ).style.display = "none";


    document.getElementById(
      "dashboard"
    ).style.display = "block";


    loadAdvertisements();


  } catch (error) {

    console.error(error);

    loginMessage.textContent =
      "Login failed. Check your email and password.";

  }

}


/* =========================================
   LOAD ADVERTISEMENTS
========================================= */

async function loadAdvertisements() {

  const container =
    document.getElementById(
      "advertisements"
    );


  container.innerHTML =
    "Loading advertisements...";


  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/advertisements?select=*&order=created_at.desc",

      {

        method: "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken

        }

      }

    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const ads =
      await response.json();


    if (!ads.length) {

      container.innerHTML =
        '<div class="empty">' +
        'No advertisements found.' +
        '</div>';

      return;

    }


    container.innerHTML = "";


    ads.forEach(function(ad) {

      const item =
        document.createElement("div");


      item.className =
        "ad";


      const status =
        ad.status || "pending";


      let statusClass =
        "pending";


      if (
        status === "approved"
      ) {

        statusClass =
          "approved";

      }


      if (
        status === "rejected"
      ) {

        statusClass =
          "rejected";

      }


      let imageHTML =
        "";


      if (ad.image_url) {

        imageHTML = `

          <img
            src="${escapeHTML(ad.image_url)}"
            alt="Advertisement image"
          >

        `;

      }


      const publicUrl =
        getPublicAdvertisementUrl(
          ad.id
        );


      item.innerHTML = `

        <h3>

          ${escapeHTML(
            ad.advert_title ||
            "Untitled Advertisement"
          )}

        </h3>


        <p>

          <strong>
            Advertiser:
          </strong>

          ${escapeHTML(
            ad.advertiser_name ||
            ""
          )}

        </p>


        <p>

          <strong>
            Description:
          </strong>

          <br>

          ${escapeHTML(
            ad.description ||
            ""
          )}

        </p>


        <p>

          <strong>
            Extended Description:
          </strong>

          <br>

          ${escapeHTML(
            ad.extended_description ||
            "No extended description provided."
          )}

        </p>


        <p>

          <strong>
            Contact:
          </strong>

          ${escapeHTML(
            ad.contact ||
            ""
          )}

        </p>


        <p class="status ${statusClass}">

          <strong>
            Status:
          </strong>

          ${escapeHTML(status)}

        </p>


        <p class="ad-id">

          Advertisement ID:
          ${escapeHTML(
            String(ad.id || "")
          )}

        </p>


        ${imageHTML}


        <!-- ADMIN ACTIONS -->

        <div class="action-section">

          <button
            class="view-ad"
            onclick="viewAdvertisement(
              '${escapeJS(ad.id)}'
            )"
          >
            View Advertisement
          </button>


          <button
            class="approve"
            onclick="updateStatus(
              '${escapeJS(ad.id)}',
              'approved'
            )"
          >
            Approve
          </button>


          <button
            class="reject"
            onclick="updateStatus(
              '${escapeJS(ad.id)}',
              'rejected'
            )"
          >
            Reject
          </button>


          <button
            class="delete"
            onclick="deleteAdvertisement(
              '${escapeJS(ad.id)}'
            )"
          >
            Delete
          </button>

        </div>


        <!-- SHARE BUTTONS -->

        <div class="share-box">

          <div class="share-title">
            Share Advertisement
          </div>


          <div class="share-buttons">

            <button
              class="whatsapp"
              onclick="shareAdvertisement(
                '${escapeJS(ad.id)}',
                'whatsapp'
              )"
            >
              WhatsApp
            </button>


            <button
              class="instagram"
              onclick="shareAdvertisement(
                '${escapeJS(ad.id)}',
                'instagram'
              )"
            >
              Instagram
            </button>


            <button
              class="facebook"
              onclick="shareAdvertisement(
                '${escapeJS(ad.id)}',
                'facebook'
              )"
            >
              Facebook
            </button>


            <button
              class="x-button"
              onclick="shareAdvertisement(
                '${escapeJS(ad.id)}',
                'x'
              )"
            >
              X
            </button>


            <button
              class="copy-link"
              onclick="copyAdvertisementLink(
                '${escapeJS(ad.id)}'
              )"
            >
              Copy Link
            </button>

          </div>

        </div>

      `;


      container.appendChild(item);

    });


  } catch (error) {

    console.error(error);

    container.innerHTML =
      "<p>Could not load advertisements.</p>";

  }

}


/* =========================================
   VIEW ADVERTISEMENT
========================================= */

function viewAdvertisement(id) {

  const url =
    getPublicAdvertisementUrl(id);


  window.open(
    url,
    "_blank"
  );

}


/* =========================================
   SHARE ADVERTISEMENT
========================================= */

async function shareAdvertisement(
  id,
  platform
) {

  const url =
    getPublicAdvertisementUrl(id);


  const title =
    "Maje AdMarket Pro Advertisement";


  /* ===============================
     WHATSAPP
  =============================== */

  if (
    platform === "whatsapp"
  ) {

    const whatsappUrl =
      "https://wa.me/?text=" +
      encodeURIComponent(
        title +
        "\n\n" +
        url
      );


    window.open(
      whatsappUrl,
      "_blank"
    );


    return;

  }


  /* ===============================
     FACEBOOK
  =============================== */

  if (
    platform === "facebook"
  ) {

    const facebookUrl =
      "https://www.facebook.com/sharer/sharer.php?u=" +
      encodeURIComponent(url);


    window.open(
      facebookUrl,
      "_blank"
    );


    return;

  }


  /* ===============================
     X / TWITTER
  =============================== */

  if (
    platform === "x"
  ) {

    const xUrl =
      "https://twitter.com/intent/tweet?text=" +
      encodeURIComponent(title) +
      "&url=" +
      encodeURIComponent(url);


    window.open(
      xUrl,
      "_blank"
    );


    return;

  }


  /* ===============================
     INSTAGRAM
  =============================== */

  if (
    platform === "instagram"
  ) {

    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            title,

          text:
            title +
            "\n\n" +
            url,

          url:
            url

        });

      } catch (error) {

        /*
          User cancelled the
          native share menu.
        */

      }


      return;

    }


    await copyAdvertisementLink(id);


    alert(
      "The advertisement link was copied. " +
      "Open Instagram and paste the link."
    );


    return;

  }

}


/* =========================================
   COPY ADVERTISEMENT LINK
========================================= */

async function copyAdvertisementLink(
  id
) {

  const url =
    getPublicAdvertisementUrl(id);


  try {

    await navigator.clipboard.writeText(
      url
    );


    showMessage(
      "Advertisement link copied successfully."
    );


  } catch (error) {

    /*
      Fallback for browsers that do not
      support navigator.clipboard.
    */

    const input =
      document.createElement("input");


    input.value =
      url;


    document.body.appendChild(
      input
    );


    input.select();


    document.execCommand(
      "copy"
    );


    input.remove();


    showMessage(
      "Advertisement link copied successfully."
    );

  }

}


/* =========================================
   APPROVE / REJECT
========================================= */

async function updateStatus(
  id,
  status
) {

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/advertisements?id=eq." +
      encodeURIComponent(id),

      {

        method: "PATCH",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          status:
            status

        })

      }

    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    showMessage(
      "Advertisement " +
      status +
      " successfully."
    );


    loadAdvertisements();


  } catch (error) {

    console.error(error);


    showMessage(
      "Could not update the advertisement. " +
      "Check your Supabase permissions."
    );

  }

}


/* =========================================
   DELETE
========================================= */

async function deleteAdvertisement(
  id
) {

  if (
    !confirm(
      "Are you sure you want to delete this advertisement?"
    )
  ) {

    return;

  }


  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/advertisements?id=eq." +
      encodeURIComponent(id),

      {

        method: "DELETE",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Prefer":
            "return=minimal"

        }

      }

    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    showMessage(
      "Advertisement deleted successfully."
    );


    loadAdvertisements();


  } catch (error) {

    console.error(error);


    showMessage(
      "Could not delete the advertisement. " +
      "Check your Supabase permissions."
    );

  }

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

  accessToken =
    null;


  document.getElementById(
    "dashboard"
  ).style.display =
    "none";


  document.getElementById(
    "loginBox"
  ).style.display =
    "block";


  document.getElementById(
    "password"
  ).value =
    "";


  document.getElementById(
    "advertisements"
  ).innerHTML =
    "";

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.style.background =
    "#eef2ff";


  message.style.color =
    "#1e3a8a";

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value || "";


  return div.innerHTML;

}


function escapeJS(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}

</script>

</body>
  </html>
